name: trusted_ecommerce_metrics
version: "1.0.0"
config-version: 2

profile: trusted_ecommerce_metrics

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  trusted_ecommerce_metrics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: analytics

seeds:
  trusted_ecommerce_metrics:
    +schema: raw
    +quote_columns: false
