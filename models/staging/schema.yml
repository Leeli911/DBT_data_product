version: 2

models:
  - name: stg_users
    description: Cleaned user records standardized from the raw users seed.
    columns:
      - name: user_id
        description: Stable user identifier.
        tests:
          - not_null
          - unique
      - name: user_created_at
        description: Timestamp when the user was first created.
        tests:
          - not_null
      - name: acquisition_channel
        description: Original acquisition channel for the user.
        tests:
          - accepted_values:
              arguments:
                values: ['paid_search', 'organic_search', 'social', 'email', 'direct', 'affiliate']
      - name: lifecycle_stage
        description: Lightweight user lifecycle label for downstream segmentation.
        tests:
          - accepted_values:
              arguments:
                values: ['new', 'active', 'at_risk']

  - name: stg_products
    description: Cleaned product catalog records standardized from the raw products seed.
    columns:
      - name: product_id
        description: Stable product identifier.
        tests:
          - not_null
          - unique
      - name: product_name
        description: Product display name.
        tests:
          - not_null
      - name: list_price
        description: Current product list price.
        tests:
          - not_null

  - name: stg_orders
    description: Cleaned order records at one row per order with defensive revenue handling.
    columns:
      - name: order_id
        description: Stable order identifier.
        tests:
          - not_null
          - unique
      - name: user_id
        description: User who placed the order.
        tests:
          - not_null
      - name: order_timestamp
        description: Timestamp when the order was placed.
        tests:
          - not_null
      - name: order_status
        description: Current order lifecycle status.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'delivered', 'returned', 'cancelled']
      - name: traffic_source
        description: Marketing or product channel credited for the order.
        tests:
          - accepted_values:
              arguments:
                values: ['paid_search', 'organic_search', 'social', 'email', 'direct', 'affiliate']
      - name: total_revenue
        description: Defensive revenue amount, defaulted to zero when raw revenue is missing.
        tests:
          - not_null
      - name: has_missing_revenue
        description: True when raw total revenue was missing before staging defaulted the value.
        tests:
          - not_null

  - name: stg_order_items
    description: Cleaned order-item records at one row per order/product line.
    columns:
      - name: order_item_id
        description: Stable order-item identifier.
        tests:
          - not_null
          - unique
      - name: order_id
        description: Parent order identifier.
        tests:
          - not_null
      - name: product_id
        description: Product purchased in the order line.
        tests:
          - not_null
      - name: quantity
        description: Quantity purchased.
        tests:
          - not_null

  - name: stg_events
    description: Deduplicated GA4-like user event records standardized from the raw events seed.
    columns:
      - name: event_id
        description: Telemetry event identifier after staging deduplication.
        tests:
          - not_null
          - unique
      - name: event_timestamp
        description: Timestamp when the event occurred.
        tests:
          - not_null
      - name: user_id
        description: User associated with the event.
        tests:
          - not_null
      - name: source_session_id
        description: Session identifier from source telemetry; later sessionization can still recompute sessions by inactivity gaps.
        tests:
          - not_null
      - name: event_name
        description: Standardized event name.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['session_start', 'page_view', 'view_item', 'add_to_cart', 'begin_checkout', 'purchase']
      - name: traffic_source
        description: Marketing or product channel associated with the event.
        tests:
          - accepted_values:
              arguments:
                values: ['paid_search', 'organic_search', 'social', 'email', 'direct', 'affiliate']
      - name: device_category
        description: Device category associated with the event.
        tests:
          - accepted_values:
              arguments:
                values: ['desktop', 'mobile', 'tablet']
