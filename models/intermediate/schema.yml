version: 2

models:
  - name: int_user_sessions
    description: Recomputed user sessions using a 30-minute inactivity boundary instead of trusting source session identifiers.
    columns:
      - name: session_id
        description: Recomputed session identifier scoped by user and inactivity gap.
        tests:
          - not_null
          - unique
      - name: user_id
        description: User associated with the session.
        tests:
          - not_null
      - name: session_start_at
        description: Timestamp of the first event in the recomputed session.
        tests:
          - not_null
      - name: session_end_at
        description: Timestamp of the last event in the recomputed session.
        tests:
          - not_null
      - name: landing_page
        description: First page location observed in the session.
      - name: exit_page
        description: Last page location observed in the session.
      - name: is_converted_session
        description: True when the session contains at least one purchase event.
        tests:
          - not_null

  - name: int_order_session_attribution
    description: Bridge model that assigns each order to a recomputed session where possible, with order-source fallback when no reliable session match exists.
    columns:
      - name: order_id
        description: Order identifier; this bridge keeps exactly one row per order.
        tests:
          - not_null
          - unique
      - name: user_id
        description: User associated with the order.
        tests:
          - not_null
      - name: converting_session_id
        description: Recomputed session identifier when the order can be linked to a session.
      - name: session_start_at
        description: Start timestamp of the matched recomputed session.
      - name: session_end_at
        description: End timestamp of the matched recomputed session.
      - name: session_traffic_source
        description: Traffic source from the matched recomputed session.
      - name: order_traffic_source
        description: Original order-level traffic source from the order record.
        tests:
          - not_null
      - name: attributed_traffic_source
        description: Traffic source used for revenue attribution.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['paid_search', 'organic_search', 'social', 'email', 'direct', 'affiliate']
      - name: attribution_method
        description: Rule used to assign the attributed traffic source.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['purchase_event_match', 'timestamp_window_match', 'order_source_fallback']
      - name: attribution_status
        description: Whether the order was linked to a recomputed session or fell back to order-level source.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['attributed', 'fallback']

  - name: int_order_items_enriched
    description: Order-item lines enriched with parent order and product attributes.
    columns:
      - name: order_item_id
        description: Stable order-item identifier.
        tests:
          - not_null
          - unique
      - name: order_id
        description: Parent order identifier.
        tests:
          - not_null
      - name: product_id
        description: Purchased product identifier.
        tests:
          - not_null
      - name: gross_item_amount
        description: Quantity multiplied by unit price before line-level discount.
        tests:
          - not_null
      - name: net_item_amount
        description: Item gross amount less line-level discount, floored at zero.
        tests:
          - not_null
